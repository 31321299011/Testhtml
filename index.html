<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ক্রিপ্টো মার্কেট বট (সুপার ফাস্ট HTML)</title>
    <style>
        :root {
            --bg: #0a0f1a;
            --card: #121826;
            --border: #2a3547;
            --text: #e0e6f0;
            --accent: #f0b90b;
            --hover: #1e2636;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.2s;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            padding: 20px;
            margin: 20px auto;
            border: 1px solid var(--border);
        }
        h1, h2 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 15px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .btn {
            background: var(--hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background: #2a3547;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240,185,11,0.2);
        }
        .btn.back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            margin-top: 15px;
        }
        .input-field, .lang-select {
            width: 100%;
            padding: 12px;
            background: #1a1f2b;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            margin: 10px 0;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--accent);
        }
        .output-box {
            background: #1a1f2b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            min-height: 80px;
            white-space: pre-wrap;
            font-family: monospace;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            word-break: break-word;
        }
        .loading {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #8b9bb5;
            margin-top: 30px;
        }
    </style>
</head>

                stats: "📊 आँकड़े\n👥 विजिट: {visits}",
                developer: "👨‍💻 डेवलपर: @jhgmaing",
                price_info: "✅ {name} ({symbol})\n💵 USD: ${usd}\n🇧🇩 BDT: ৳{bdt}",
                cal_hint: "प्रारूप: [राशि] [मुद्रा] to [मुद्रा]",
                select_lang: "🌍 भाषा चुनें",
                btn_prices: "📊 शीर्ष सिक्के",
                btn_search: "🔍 खोजें",
                btn_calc: "🧮 कैलकुलेटर",
                btn_lang: "🌐 भाषा",
                btn_help: "❓ सहायता",
                btn_dev: "👤 डेवलपर",
                btn_stats: "📈 आँकड़े"
            }
        };

        // API Endpoints
        const APIS = {
            coingecko: {
                search: q => `https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`,
                price: id => `https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`,
                markets: () => 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1&sparkline=false'
            },
            coincap: {
                search: q => `https://api.coincap.io/v2/assets?search=${encodeURIComponent(q)}&limit=1`,
                price: id => `https://api.coincap.io/v2/assets/${id}`,
                markets: () => 'https://api.coincap.io/v2/assets?limit=20'
            },
            coinpaprika: {
                search: q => `https://api.coinpaprika.com/v1/search?q=${encodeURIComponent(q)}&c=currencies&limit=1`,
                price: id => `https://api.coinpaprika.com/v1/tickers/${id}`,
                markets: () => 'https://api.coinpaprika.com/v1/tickers?quotes=USD&limit=20'
            }
        };
        const FRANKFURTER_API = 'https://api.frankfurter.app/latest?from=USD&to=BDT';

        // ইন-মেমোরি ক্যাশ
        const cache = {
            price: new Map(),   // coinId -> {usd, ts}
            search: new Map(),  // queryLower -> {coins, ts}
            rate: { usdBdt: 118.0, ts: 0 },
            ttl: { price: 30000, search: 300000, rate: 300000 }
        };

        // মাল্টি API রেসিং (fastest wins)
        async function raceFetch(urls) {
            const controllers = urls.map(() => new AbortController());
            const promises = urls.map((url, i) =>
                fetch(url, { signal: controllers[i].signal })
                    .then(r => r.ok ? r.json() : Promise.reject())
                    .catch(() => null)
            );
            const results = await Promise.allSettled(promises);
            for (const r of results) {
                if (r.status === 'fulfilled' && r.value) return r.value;
            }
            return null;
        }

        // USD→BDT রেট (ক্যাশসহ)
        async function getUsdBdtRate() {
            const now = Date.now();
            if (cache.rate.usdBdt && (now - cache.rate.ts) < cache.ttl.rate) return cache.rate.usdBdt;
            try {
                const res = await fetch(FRANKFURTER_API);
                const data = await res.json();
                cache.rate.usdBdt = data.rates.BDT;
                cache.rate.ts = now;
                return data.rates.BDT;
            } catch {
                return cache.rate.usdBdt || 118.0;
            }
        }

        // কয়েন সার্চ (ক্যাশিং সহ)
        async function searchCoins(query) {
            const key = query.toLowerCase().trim();
            const now = Date.now();
            if (cache.search.has(key) && (now - cache.search.get(key).ts) < cache.ttl.search) {
                return cache.search.get(key).coins;
            }
            const urls = [APIS.coingecko.search(query), APIS.coincap.search(query), APIS.coinpaprika.search(query)];
            const data = await raceFetch(urls);
            let coins = [];
            if (data) {
                if (data.coins) coins = data.coins.map(c => ({ id: c.id, name: c.name, symbol: c.symbol }));
                else if (data.data) coins = data.data.map(a => ({ id: a.id, name: a.name, symbol: a.symbol }));
                else if (data.currencies) coins = data.currencies.map(c => ({ id: c.id, name: c.name, symbol: c.symbol }));
            }
            cache.search.set(key, { coins, ts: now });
            return coins;
        }

        // কয়েন প্রাইস (ক্যাশিং সহ)
        async function getCoinPrice(coinId) {
            const now = Date.now();
            if (cache.price.has(coinId) && (now - cache.price.get(coinId).ts) < cache.ttl.price) {
                return cache.price.get(coinId).usd;
            }
            const urls = [APIS.coingecko.price(coinId), APIS.coincap.price(coinId), APIS.coinpaprika.price(coinId)];
            const data = await raceFetch(urls);
            let usd = null;
            if (data) {
                if (data[coinId]?.usd) usd = data[coinId].usd;
                else if (data.data?.priceUsd) usd = parseFloat(data.data.priceUsd);
                else if (data.quotes?.USD?.price) usd = data.quotes.USD.price;
            }
            if (usd !== null) cache.price.set(coinId, { usd, ts: now });
            return usd;
        }

        // টপ ২০ (ক্যাশিং সহ)
        async function getTop20Coins() {
            const now = Date.now();
            const key = '__top20';
            if (cache.price.has(key) && (now - cache.price.get(key).ts) < cache.ttl.price) {
                return cache.price.get(key).data;
            }
            const urls = [APIS.coingecko.markets(), APIS.coincap.markets(), APIS.coinpaprika.markets()];
            const data = await raceFetch(urls);
            let coins = [];
            if (data) {
                if (Array.isArray(data) && data[0]?.current_price !== undefined) {
                    coins = data.map(c => ({ name: c.name, symbol: c.symbol, current_price: c.current_price, change_24h: c.price_change_percentage_24h || 0 }));
                } else if (data.data) {
                    coins = data.data.slice(0,20).map(a => ({ name: a.name, symbol: a.symbol, current_price: parseFloat(a.priceUsd), change_24h: parseFloat(a.changePercent24Hr||0) }));
                } else if (Array.isArray(data) && data[0]?.quotes) {
                    coins = data.slice(0,20).map(t => ({ name: t.name, symbol: t.symbol, current_price: t.quotes.USD.price, change_24h: t.quotes.USD.percent_change_24h || 0 }));
                }
            }
            cache.price.set(key, { data: coins, ts: now });
            return coins;
        }

        // কনভার্টার
        async function convert(amount, fromCur, toCur) {
            fromCur = fromCur.toLowerCase(); toCur = toCur.toLowerCase();
            const rate = await getUsdBdtRate();
            if ((fromCur === 'usd' || fromCur === 'bdt') && (toCur === 'usd' || toCur === 'bdt')) {
                if (fromCur === 'usd' && toCur === 'bdt') return amount * rate;
                if (fromCur === 'bdt' && toCur === 'usd') return amount / rate;
                return amount;
            }
            const cryptoId = (fromCur !== 'usd' && fromCur !== 'bdt') ? fromCur : toCur;
            const coins = await searchCoins(cryptoId);
            if (!coins.length) return null;
            const usdPrice = await getCoinPrice(coins[0].id);
            if (usdPrice === null) return null;
            if (fromCur === cryptoId && toCur === 'usd') return amount * usdPrice;
            if (fromCur === cryptoId && toCur === 'bdt') return amount * usdPrice * rate;
            if (fromCur === 'usd' && toCur === cryptoId) return usdPrice ? amount / usdPrice : null;
            if (fromCur === 'bdt' && toCur === cryptoId) {
                const usd = amount / rate;
                return usdPrice ? usd / usdPrice : null;
            }
            return null;
        }

        // UI State
        let currentLang = 'bn';
        const app = document.getElementById('app');

        function getStats() {
            const visits = parseInt(localStorage.getItem('visits') || '0') + 1;
            localStorage.setItem('visits', visits);
            const commands = parseInt(localStorage.getItem('commands') || '0');
            return { visits, commands };
        }
        function incCommand() {
            localStorage.setItem('commands', (parseInt(localStorage.getItem('commands')||'0')+1).toString());
        }
        function backButton() {
            return `<button class="btn back-btn" onclick="renderMainMenu()">🔙 Back</button>`;
        }

        function renderMainMenu() {
            const t = TEXTS[currentLang];
            app.innerHTML = `
                <h1>🚀 Crypto Market Bot</h1>
                <p>${t.welcome.replace(/\n/g,'<br>')}</p>
                <div class="btn-grid">
                    <button class="btn" onclick="showPrices()">${t.btn_prices}</button>
                    <button class="btn" onclick="showSearch()">${t.btn_search}</button>
                    <button class="btn" onclick="showCalc()">${t.btn_calc}</button>
                    <button class="btn" onclick="showLangMenu()">${t.btn_lang}</button>
                    <button class="btn" onclick="showHelp()">${t.btn_help}</button>
                    <button class="btn" onclick="showDeveloper()">${t.btn_dev}</button>
                    <button class="btn" onclick="showStats()">${t.btn_stats}</button>
                </div>
            `;
        }

        function showLoading(msg) {
            const t = TEXTS[currentLang];
            app.innerHTML = `<div class="loading">${msg || t.fetching}</div>`;
        }

        async function showPrices() {
            showLoading();
            const t = TEXTS[currentLang];
            try {
                const coins = await getTop20Coins();
                if (!coins.length) {
                    app.innerHTML = `<p>${t.coin_not_found}</p> ${backButton()}`;
                    return;
                }
                const rate = await getUsdBdtRate();
                let html = `<h2>${t.top_coins}</h2>`;
                coins.forEach(c => {
                    const usd = c.current_price;
                    const bdt = usd * rate;
                    const change = c.change_24h || 0;
                    const arrow = change >= 0 ? '📈' : '📉';
                    html += `<p>${arrow} <b>${c.name} (${c.symbol.toUpperCase()})</b><br>
                    💵 $${usd.toFixed(4)} | ৳${bdt.toFixed(2)} &nbsp; ${change.toFixed(2)}%</p>`;
                });
                app.innerHTML = html + backButton();
                incCommand();
            } catch {
                app.innerHTML = `<p>${t.coin_not_found}</p> ${backButton()}`;
            }
        }

        function showSearch() {
            const t = TEXTS[currentLang];
            app.innerHTML = `
                <h2>${t.search_usage}</h2>
                <input class="input-field" id="searchInput" placeholder="Bitcoin" />
                <button class="btn" onclick="doSearch()">🔍 ${t.btn_search}</button>
                ${backButton()}
            `;
        }

        async function doSearch() {
            const input = document.getElementById('searchInput');
            if (!input || !input.value.trim()) return;
            showLoading();
            const t = TEXTS[currentLang];
            try {
                const coins = await searchCoins(input.value.trim());
                if (!coins.length) {
                    app.innerHTML = `<p>${t.coin_not_found}</p> ${backButton()}`;
                    return;
                }
                const coin = coins[0];
                const usd = await getCoinPrice(coin.id);
                if (usd === null) {
                    app.innerHTML = `<p>${t.coin_not_found}</p> ${backButton()}`;
                    return;
                }
                const rate = await getUsdBdtRate();
                const bdt = usd * rate;
                let info = t.price_info.replace('{name}', coin.name).replace('{symbol}', coin.symbol.toUpperCase()).replace('{usd}', usd.toFixed(4)).replace('{bdt}', bdt.toFixed(2)).replace('{id}', coin.id);
                app.innerHTML = `<p>${info.replace(/\n/g,'<br>')}</p><p>💡 ${t.cal_hint}</p> ${backButton()}`;
                incCommand();
            } catch {
                app.innerHTML = `<p>${t.coin_not_found}</p> ${backButton()}`;
            }
        }

        function showCalc() {
            const t = TEXTS[currentLang];
            app.innerHTML = `
                <h2>🧮 ${t.btn_calc}</h2>
                <p>${t.cal_hint}</p>
                <input class="input-field" id="calcInput" placeholder="1 btc to usd" />
                <button class="btn" onclick="doCalc()">${t.btn_calc}</button>
                <div id="calcResult" class="output-box"></div>
                ${backButton()}
            `;
        }

        async function doCalc() {
            const input = document.getElementById('calcInput');
            const resultBox = document.getElementById('calcResult');
            const t = TEXTS[currentLang];
            if (!input) return;
            const match = input.value.trim().match(/^([\d.]+)\s+(\w+)\s+to\s+(\w+)$/i);
            if (!match) {
                resultBox.innerHTML = t.conversion_error;
                return;
            }
            const amount = parseFloat(match[1]);
            const fromCur = match[2];
            const toCur = match[3];
            resultBox.innerHTML = t.fetching;
            try {
                const res = await convert(amount, fromCur, toCur);
                if (res === null) {
                    resultBox.innerHTML = t.conversion_error;
                    return;
                }
                const formatted = Number.isInteger(res) ? res.toFixed(0) : parseFloat(res.toFixed(8)).toString();
                resultBox.innerHTML = t.conversion_result.replace('{from_amount}', amount).replace('{from_currency}', fromCur.toUpperCase()).replace('{to_amount}', formatted).replace('{to_currency}', toCur.toUpperCase());
                incCommand();
            } catch {
                resultBox.innerHTML = t.conversion_error;
            }
        }

        function showLangMenu() {
            const t = TEXTS[currentLang];
            app.innerHTML = `
                <h2>${t.select_lang}</h2>
                <select class="lang-select" id="langSelect">
                    <option value="bn" ${currentLang==='bn'?'selected':''}>🇧🇩 বাংলা</option>
                    <option value="en" ${currentLang==='en'?'selected':''}>🇬🇧 English</option>
                    <option value="ru" ${currentLang==='ru'?'selected':''}>🇷🇺 Русский</option>
                    <option value="hi" ${currentLang==='hi'?'selected':''}>🇮🇳 हिन्दी</option>
                </select>
                <button class="btn" onclick="changeLang()">✅ ${t.btn_lang}</button>
                ${backButton()}
            `;
        }

        function changeLang() {
            const sel = document.getElementById('langSelect');
            if (sel) {
                currentLang = sel.value;
                localStorage.setItem('lang', currentLang);
            }
            alert(TEXTS[currentLang].lang_changed);
            renderMainMenu();
        }

        function showHelp() {
            app.innerHTML = `<p>${TEXTS[currentLang].help.replace(/\n/g,'<br>')}</p> ${backButton()}`;
        }

        function showDeveloper() {
            app.innerHTML = `<p>${TEXTS[currentLang].developer.replace(/\n/g,'<br>')}</p> ${backButton()}`;
        }

        function showStats() {
            const { visits, commands } = getStats();
            app.innerHTML = `<p>${TEXTS[currentLang].stats.replace('{visits}', visits).replace('{commands}', commands)}</p> ${backButton()}`;
        }

        // শুরু
        (function init() {
            const savedLang = localStorage.getItem('lang');
            if (savedLang && TEXTS[savedLang]) currentLang = savedLang;
            getStats();
            renderMainMenu();
        })();
    </script>
</body>
</html>
